# Verifies the project's central premise on a real Android system: that a proxy APK carrying
# package P, installed for user N, can read and write /storage/emulated/N/Android/{data,obb}/P
# and hand those bytes to another app.
#
# That claim is about the kernel's FUSE layer, so no JVM test can cover it. This workflow is the
# only place in the project where it is actually checked.
#
# Two notes on shape, both learned from failing runs:
#  * No `android-actions/setup-android`. GitHub's ubuntu runners already ship the SDK at
#    /usr/local/lib/android/sdk, and v3 of that action fails installing the long-removed legacy
#    `tools` package. We install exactly what we need instead — and resolve `sdkmanager` by
#    search, because it is not on PATH and lives in a *versioned* cmdline-tools directory.
#  * One emulator boot, not two. Booting costs minutes, and a second `android-emulator-runner`
#    step would start from a clean device and lose the user profile the first one created.
name: emulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time: emulator jobs are slow and queueing them wastes monthly minutes.
concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tuned for a 2-vCPU runner: no daemon (the job must not outlive its step), no parallelism,
  # and enough heap for AGP 9 plus the Compose compiler.
  #
  # org.gradle.caching=false matters: ProxyApkFactoryTest's *side effect* is the generated APK
  # that the next step verifies with apksigner. A cache hit silently skips the test, the artifact
  # is never written, and the verify step fails with a confusing "No such file or directory".
  # Dependency caching is still handled by gradle/actions/setup-gradle.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
    -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
    -Dorg.gradle.caching=false

jobs:
  jvm:
    name: Unit tests + generated-APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK packages this project needs
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          # sdkmanager is not on PATH, and cmdline-tools is versioned (…/cmdline-tools/16.0/bin).
          # Resolve it rather than hardcoding a version the runner image will eventually change.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "using $SDKMANAGER"
          BT="$ANDROID_HOME/build-tools/37.0.0"
          { echo "$ANDROID_HOME/platform-tools"; echo "$BT"; echo "$(dirname "$SDKMANAGER")"; } >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$BT:$(dirname "$SDKMANAGER"):$PATH"

          # The runner's SDK directory is root-owned, so installing as the `runner` user fails
          # at "Computing updates" with exit 1 and no diagnostic. Prefer a user-writable SDK and
          # fall back to sudo, printing the reason either way.
          if [ -w "$ANDROID_HOME" ]; then
            SUDO=""
            echo "SDK dir is writable by $(id -un); installing without sudo"
          else
            SUDO="sudo -E"
            echo "SDK dir $ANDROID_HOME is NOT writable by $(id -un); using sudo"
            ls -ld "$ANDROID_HOME"
          fi
          yes | $SUDO "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Only platform-tools and build-tools are pinned. The *platform* is left to AGP's
          # auto-provisioning: it knows the exact package id matching compileSdk, whereas
          # hardcoding "platforms;android-37" fails because the real ids are
          # "android-37.0" / "android-37.2".
          $SUDO "$SDKMANAGER" --verbose "platform-tools" "build-tools;37.0.0" 2>&1 | tail -25
          $SUDO "$SDKMANAGER" --list_installed
          # sudo-installed files can end up root-owned, which then breaks Gradle's own SDK
          # writes; hand them back to the runner user.
          [ -n "$SUDO" ] && sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" || true

      # The wrapper's distributionUrl points at a GitHub mirror because the reference build
      # sandbox blocks services.gradle.org. That mirror is reachable from here too.
      # --rerun-tasks is belt-and-braces on top of caching=false: the generated-APK
      # verification below depends on this step having actually executed.
      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest --rerun-tasks

      # `check` rather than just `test`: it also runs lint and checkProxyTemplateFresh.
      #
      # Neither had ever run in CI, and both were hiding real defects. Lint found six NewApi
      # errors — guaranteed crashes on supported devices, all in code paths no test executed
      # (SigningInfo is API 28 against minSdk 26; setDontKillApp is API 34) — plus a missing
      # REQUEST_DELETE_PACKAGES that would have made every data-preserving teardown throw
      # SecurityException. checkProxyTemplateFresh catches the committed proxy template drifting
      # from :proxy's sources, which otherwise surfaces at runtime on a user's device.
      #
      # Lint is slow (it is most of this step's time) but it is the only thing in the pipeline
      # that knows the platform's API levels, and this project's whole risk profile is
      # "correct on the JVM, wrong on a device".
      - name: Lint and template freshness
        run: ./gradlew --no-daemon --console=plain :app:check

      - name: Build every variant
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleRelease :proxy:assembleRelease

      # The generated proxy APK is written by ProxyApkFactoryTest, so verifying it here means the
      # platform's own signer checks our hand-rolled v1/v2 implementation on every push.
      - name: Verify the generated proxy APK with apksigner
        run: |
          set -euo pipefail
          if [ ! -d app/build/outputs/proxy-test ]; then
            echo "::error::app/build/outputs/proxy-test does not exist."
            echo "ProxyApkFactoryTest writes the sample APK there. Either the test step was"
            echo "served from cache (it must actually run), or it skipped itself because no"
            echo ":proxy release APK was found."
            exit 1
          fi
          APK=$(find app/build/outputs/proxy-test -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::no APK in app/build/outputs/proxy-test"; exit 1; }
          echo "Verifying $APK"
          apksigner verify --verbose --print-certs "$APK"
          aapt2 dump badging "$APK" | grep '^package:'
          zipalign -c -p 4 "$APK" && echo "ALIGNMENT OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/
            app/build/outputs/proxy-test/
          if-no-files-found: warn
          retention-days: 14

  premise:
    name: FUSE premise (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: jvm
    # True only for the entry whose image has not booted yet; see the matrix comment. A job that
    # is allowed to fail must be labelled as such in its name, or a green run means nothing.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # 34 and 35 are far above API 30, where the FUSE restriction landed — anything older
        # would pass for the wrong reason. Both use `target: default` (AOSP), because planting
        # fixture bytes into a *secondary* user's private storage needs `adb root` and
        # google_apis images are production-signed and refuse it.
        #
        # There is no AOSP `default` system image above API 35 — `sdkmanager --list` offers
        # google_apis, google_apis_playstore and google_atd for 36 and 37 and nothing else — so
        # those levels run on google_apis.
        #
        # MEASURED, and it contradicts what this workflow used to assume: `adb root` SUCCEEDS on
        # `system-images;android-36;google_apis;x86_64`. Run #36 rooted on attempt 1, planted
        # fixtures under /data/media/10, cross-checked the per-user uid against
        # /data/user/10/<pkg>, asserted `pm uninstall -k` preservation, and reported OK (11 tests)
        # with nothing skipped — the full suite, not a subset. The "google_apis is production-signed
        # and refuses adb root" finding from milestone 4 was measured on API 34/35 images and is
        # true there; it is not a property of the `google_apis` target in general, and treating it
        # as one nearly cost us coverage of the newest platform.
        #
        # `allow-no-root: 1` on those jobs is therefore a *fallback*, not the expected path: if a
        # future image stops being rootable the job degrades to the subset that needs no root and
        # says so loudly (a `::warning::` annotation plus a banner and a different final line)
        # instead of failing for an environmental reason or, worse, passing while proving less.
        # 34 and 35 stay at 0, so losing root there fails the run — which is what run #30 should
        # have done rather than reporting a cause it had not established.
        #
        # api-level 37.0 is passed through verbatim into the package name, which is how the real
        # image ids are spelled (`system-images;android-37.0;google_apis;x86_64`); `37` alone does
        # not exist. The action accepts non-numeric values here — its own docs list 'R' and
        # 'TiramisuPrivacySandbox'.
        include:
          - api-level: 34
            target: default
            label: API 34, AOSP
            allow-no-root: 0
            experimental: false
            boot-timeout: 1200
            extra-emulator-options: ""
            ram-size: ""
            disk-size: ""
          - api-level: 35
            target: default
            label: API 35, AOSP
            allow-no-root: 0
            experimental: false
            boot-timeout: 1200
            extra-emulator-options: ""
            ram-size: ""
            disk-size: ""
          - api-level: 36
            target: google_apis
            label: API 36, google_apis
            allow-no-root: 1
            experimental: false
            boot-timeout: 1200
            extra-emulator-options: ""
            ram-size: ""
            disk-size: ""
          # Quoted on purpose. Unquoted, YAML parses 37.0 as a float and the Actions expression
          # renders it as "37", which builds `system-images;android-37;google_apis;x86_64` — a
          # package that does not exist. The real id keeps the minor.
          # Quoted above for a reason that turned out to be the ONLY thing needed to address the
          # image: `system-images;android-37.0;google_apis;x86_64` installed and the AVD was built
          # from it in runs #37 and #38. What then happened is that the emulator never booted:
          # `adb: device offline` for the whole budget, no crash, no kernel output, nothing.
          # 4096M of RAM and a 1200 s timeout changed nothing, and API 36 on the same action,
          # emulator build and runner boots in about a minute.
          #
          # So this entry is EXPERIMENTAL and says so: `continue-on-error` keeps main green while
          # the question is open, `-show-kernel` puts the guest kernel console in the job log,
          # which is the only evidence that can distinguish "slow", "panicking" and "this image
          # needs an emulator the stable channel has not shipped yet", and a short boot timeout
          # keeps the cycle cheap. Guessing at fixes without that output is how this project spent
          # six runs on a directory path. If the kernel log does not explain it, the job gets
          # deleted and the blocker documented — a measured negative result is worth keeping, an
          # indefinitely-red or indefinitely-ignored job is not.
          - api-level: "37.0"
            target: google_apis
            label: API 37, google_apis — EXPERIMENTAL
            allow-no-root: 1
            experimental: true
            boot-timeout: 900
            extra-emulator-options: -show-kernel
            ram-size: 4096M
            disk-size: 6144M
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK packages this project needs
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          BT="$ANDROID_HOME/build-tools/37.0.0"
          { echo "$ANDROID_HOME/platform-tools"; echo "$BT"; echo "$(dirname "$SDKMANAGER")"; } >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$BT:$(dirname "$SDKMANAGER"):$PATH"
          if [ -w "$ANDROID_HOME" ]; then SUDO=""; else SUDO="sudo -E"; fi
          yes | $SUDO "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Only platform-tools and build-tools are pinned. The *platform* is left to AGP's
          # auto-provisioning: it knows the exact package id matching compileSdk, whereas
          # hardcoding "platforms;android-37" fails because the real ids are
          # "android-37.0" / "android-37.2".
          $SUDO "$SDKMANAGER" --verbose "platform-tools" "build-tools;37.0.0" 2>&1 | tail -25
          [ -n "$SUDO" ] && sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME" || true

      # GitHub-hosted Linux runners expose /dev/kvm, but the udev rules leave it root-only.
      # Without this the emulator falls back to software emulation and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build the APKs
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      # ProxyApkFactoryTest writes a signed proxy APK for com.example.targetgame as a side effect,
      # so CI exercises exactly the code path the app uses at runtime rather than a separate
      # generator. ProdSignedProxyTest additionally writes a proxy signed with a DIFFERENT (fresh
      # random) key that carries the app's certificate digest — the production key layout, which
      # is what the caller-auth phase of the premise script verifies.
      - name: Generate the proxy APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest \
            --tests '*ProxyApkFactoryTest*' --tests '*ProdSignedProxyTest*' --rerun-tasks
          APK=$(find app/build/outputs/proxy-test -name 'proxy-*.apk' | head -1)
          test -n "$APK"
          cp "$APK" /tmp/proxy.apk
          ls -l /tmp/proxy.apk
          aapt2 dump badging /tmp/proxy.apk | grep '^package:'
          # The production caller-auth artifact lives in its own output dir so it cannot be
          # confused with the same-key proxy above (which the jvm job verifies with head -1).
          PRODSIGN=$(find app/build/outputs/proxy-prodsign -name 'proxy-prodsign-*.apk' | head -1)
          test -n "$PRODSIGN" || { echo "::error::no prod-signed proxy was generated"; exit 1; }
          cp "$PRODSIGN" /tmp/proxy-prodsign.apk
          ls -l /tmp/proxy-prodsign.apk
          aapt2 dump badging /tmp/proxy-prodsign.apk | grep '^package:'
          # Guard the scenario's fidelity: the two proxies MUST have different signers, or the
          # caller-auth test would silently exercise the permission path again and prove nothing.
          echo "--- same-key proxy signer ---";   apksigner verify --print-certs /tmp/proxy.apk          | grep -iE 'SHA-256 digest' || true
          echo "--- prod-signed proxy signer ---"; apksigner verify --print-certs /tmp/proxy-prodsign.apk | grep -iE 'SHA-256 digest' || true
          A=$(apksigner verify --print-certs /tmp/proxy.apk | grep -iE 'SHA-256 digest' | head -1)
          B=$(apksigner verify --print-certs /tmp/proxy-prodsign.apk | grep -iE 'SHA-256 digest' | head -1)
          if [ "$A" = "$B" ]; then
            echo "::error::prod-signed proxy has the SAME signer as the same-key proxy; the production scenario is not being tested"
            exit 1
          fi
          echo "signers differ: production caller-auth scenario is faithful"

      # Creating a user and installing packages both need uid 2000, so the orchestration lives in
      # a shell script rather than in the test — an app cannot do either, even instrumented.
      - name: Run the premise test in a secondary profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # `default` (AOSP) wherever one exists. Planting fixture bytes into a *secondary* user's
          # private storage requires uid 0: uid 2000 is exempt from the FUSE filter only inside its
          # own mount namespace and so cannot reach /storage/emulated/10 at all. Root is also more
          # faithful — the raw /data/media/<user> path we write to is exactly where the
          # rename-aside trick operates. There is no `default` image above API 35, so those levels
          # use google_apis, which turns out to be rootable anyway; see the matrix comment.
          target: ${{ matrix.target }}
          arch: x86_64
          # `ram-size`, NOT `ram` — and getting that wrong is worth recording, because it cost two
          # runs and produced a confidently wrong conclusion. `ram` is not one of this action's 26
          # inputs; GitHub passes an unknown `with:` key through as an environment variable and the
          # action ignores it, so `ram: 4096M` did nothing at all. The config dump said
          # "RAM size: " (empty) in both runs and I read past it. Commit 7e010f5 therefore claimed
          # the memory hypothesis was "worth one test and is now disproved" when the test had never
          # been executed — the exact failure mode this project's methodology section warns about,
          # committed to git by the person writing the methodology.
          #
          # Per-matrix rather than global: the three jobs that boot get "", i.e. today's behaviour
          # unchanged (the emulator auto-bumps them to 2560MB and logs "Increasing RAM size"), so
          # this changes exactly one variable on the one job that is failing.
          ram-size: ${{ matrix.ram-size }}
          # Same lesson as ram-size, learned one run later: verified against the action's source
          # (src/emulator-manager.ts pushes `disk.dataPartition.size=<value>` into config.ini)
          # rather than assumed from the input's name. Run #40 got the guest to 4 GB and it booted
          # all the way to system_server, then `pm create-user` failed with
          # "Cannot add user. Not enough space on disk. (code 5)" — UserManagerService checks
          # allocatable bytes on /data before allowing a secondary profile, and the API 37 image's
          # default data partition is too small for one.
          disk-size: ${{ matrix.disk-size }}
          # 600 was enough for every image that booted, but the budget is what turned a slow boot
          # into a hard failure with no diagnostic. Headroom costs nothing on a job that is
          # already the longest in the workflow.
          emulator-boot-timeout: ${{ matrix.boot-timeout }}
          # No snapshot: a restored one could carry a user profile or an install over from a
          # previous attempt and make a failing step look like it succeeded.
          disable-animations: true
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect ${{ matrix.extra-emulator-options }}
          script: .github/scripts/run-premise-test.sh ${{ matrix.api-level }}
        env:
          # 0 for the AOSP jobs, so losing root fails the run loudly instead of silently degrading
          # to a reduced suite that still reports success. 1 for the google_apis jobs, where root
          # is available today but is a property of the image Google published rather than
          # something we control; see the matrix comment.
          ALLOW_NO_ROOT: ${{ matrix.allow-no-root }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premise-results-api${{ matrix.api-level }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            premise-logs/
          if-no-files-found: warn
          retention-days: 14
